<single-spa-router>
  <!--

    This is the single-spa Layout Definition for your microfrontends.
    See https://single-spa.js.org/docs/layout-definition/ for more information.

  -->

  <!-- Example layouts you might find helpful:

  <nav>
    <application name="@org/navbar"></application>
  </nav>
  <route path="settings">
    <application name="@org/settings"></application>
  </route>

  -->

  <main>
    <route path="/dashboard" exact>
      <div style="display: flex; height: 100vh">
        <application name="@FIAP/sidebar"></application>
        <application name="@FIAP/dashboard"></application>
      </div>
    </route>

    <route path="/account" exact>
      <application name="@FIAP/account"></application>
    </route>

    <route path="/transaction">
      <application name="@FIAP/transaction"></application>
    </route>

    <route path="/login">
      <application name="@FIAP/login"></application>
    </route>

    <route default>
      <application name="@FIAP/not-found"></application>
    </route>
  </main>
</single-spa-router>
